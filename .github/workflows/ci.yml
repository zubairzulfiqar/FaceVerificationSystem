name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Unit and API tests
        run: pytest -q
      - name: Fairness audit (synthetic demo)
        run: python -m faceverify.cli audit --synthetic --out runs
      - uses: actions/upload-artifact@v4
        with:
          name: audit
          path: runs/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (compiles dlib)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: faceverify:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the running container
        run: |
          docker run -d --name fv -p 5000:5000 faceverify:ci
          for i in $(seq 1 30); do curl -sf localhost:5000/health && break; sleep 2; done
          curl -sf localhost:5000/health | grep '"model":"dlib-resnet-128"'
          python3 -c "from PIL import Image; Image.new('RGB',(120,120),(90,140,200)).save('blank.png')"
          code=$(curl -s -o out.json -w '%{http_code}' -F name=test -F image=@blank.png localhost:5000/enroll)
          cat out.json; test "$code" = 400 && grep -q 'No face detected' out.json
          curl -sf localhost:5000/metrics | grep 'faceverify_decisions_total{result="no_face"} 1.0'
          docker logs fv | tail -5
